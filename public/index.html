<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Crawl: First Playable Test</title>
<style>
  :root { --neon:#3df2e0; --hot:#ff3ea5; --panel:rgba(8,10,20,.88); --line:rgba(61,242,224,.45); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#050507; overflow:hidden; color:#dfe7ee;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; touch-action:none;
    -webkit-user-select:none; user-select:none; }
  canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #vig { position:fixed; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 42%, rgba(0,0,0,.34) 78%, rgba(0,0,0,.7) 100%); }
  #grain { position:fixed; inset:0; z-index:3; pointer-events:none; opacity:.09; mix-blend-mode:overlay; }
  .hud { position:fixed; z-index:5; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  #title { top:8px; left:10px; padding:5px 9px; background:var(--panel); border:1px solid var(--line); border-radius:4px; color:var(--neon); }
  #title b { color:#fff; font-weight:600; }
  #stats { top:8px; right:10px; display:flex; gap:6px; align-items:center; }
  .chip { padding:5px 9px; background:var(--panel); border:1px solid var(--line); border-radius:4px; color:#cfd8e3; }
  button { font:inherit; color:inherit; cursor:pointer; }
  #gearBtn { padding:6px 12px; background:var(--panel); border:1px solid var(--hot); border-radius:4px; color:var(--hot);
    text-transform:uppercase; letter-spacing:.08em; font-size:11px; }
  #sys { left:50%; top:44px; transform:translateX(-50%); width:min(440px,78vw); text-transform:none; letter-spacing:0;
    font-size:12px; line-height:1.4; background:var(--panel); border:1px solid var(--neon); border-radius:6px;
    padding:8px 11px; box-shadow:0 0 18px rgba(61,242,224,.25); opacity:0; transition:opacity .25s; pointer-events:none; }
  #sys.on { opacity:1; }
  #sys .tag { display:block; color:var(--hot); font-size:10px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:2px; }
  #stick { position:fixed; z-index:6; left:20px; bottom:20px; width:128px; height:128px; border-radius:50%;
    background:rgba(20,22,34,.55); border:1px solid rgba(255,255,255,.28); touch-action:none; }
  #knob { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%;
    background:rgba(61,242,224,.3); border:1px solid var(--neon); pointer-events:none; }
  #bar { position:fixed; z-index:6; right:16px; bottom:20px; display:flex; gap:8px; align-items:flex-end; }
  .act { min-width:56px; height:48px; padding:0 8px; border-radius:8px; background:rgba(20,22,34,.82);
    border:1px solid rgba(255,255,255,.3); color:#fff; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; }
  .act.big { width:68px; height:68px; border-radius:50%; border-color:var(--neon); font-size:11px; }
  .act.on { background:rgba(61,242,224,.35); }
  .act.held { border-color:var(--hot); color:var(--hot); background:rgba(255,62,165,.16); }
  #menu { position:fixed; z-index:7; right:16px; bottom:98px; width:min(310px,62vw); max-height:calc(100vh - 150px); overflow-y:auto;
    background:var(--panel); border:1px solid var(--neon); border-radius:6px; padding:6px; display:none; touch-action:pan-y;
    box-shadow:0 0 18px rgba(61,242,224,.2); }
  #menu.on { display:block; }
  #menu .mh { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--hot); padding:3px 5px 6px; }
  #menu button { display:flex; width:100%; justify-content:space-between; align-items:center; gap:8px; text-align:left; padding:8px 7px;
    background:transparent; border:0; border-top:1px solid rgba(255,255,255,.1); font-size:11.5px; color:#fff; }
  #menu button i { font-style:normal; font-size:9.5px; color:var(--neon); white-space:nowrap; }
  #menu button:disabled { color:#6f7a88; } #menu button:disabled i { color:#6f7a88; }
  #gear { position:fixed; z-index:8; top:0; bottom:0; left:0; width:min(330px,56vw); background:rgba(8,10,20,.97);
    border-right:1px solid var(--line); padding:10px 12px; overflow-y:auto; touch-action:pan-y; display:none; }
  #gear.on { display:block; }
  #gear h2 { margin:0 0 2px; font-size:12px; letter-spacing:.14em; color:var(--neon); text-transform:uppercase; font-weight:600; }
  #gear p { margin:0 0 8px; font-size:10.5px; color:#9aa6b4; line-height:1.35; }
  .row { display:flex; align-items:center; gap:6px; padding:5px 0; border-top:1px solid rgba(255,255,255,.08); font-size:11px; }
  .row .slot { width:58px; color:#9aa6b4; text-transform:uppercase; font-size:9.5px; letter-spacing:.08em; }
  .row .val { flex:1; text-align:center; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row button { width:30px; height:30px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.22); border-radius:5px; }
  .row .sw { border-radius:50%; border:2px solid rgba(255,255,255,.7); }
  .row.dim .val { color:#7f8a98; font-size:10px; }
  #tabs { display:flex; gap:4px; margin-bottom:4px; }
  #tabs button { flex:1; padding:7px 0; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.2); border-radius:4px; color:#9aa6b4; }
  #tabs button.on { border-color:var(--neon); color:var(--neon); background:rgba(61,242,224,.1); }
  .sheet { font-size:11px; line-height:1.45; color:#cfd8e3; }
  .sheet .who { color:#fff; font-size:12px; margin:6px 0; }
  .sheet .portrait { display:block; width:112px; height:140px; object-fit:cover; margin:6px 0 2px; border:1px solid var(--neon); border-radius:4px;
    box-shadow:0 0 14px rgba(61,242,224,.3); filter:contrast(1.1) saturate(.75) sepia(.18); }
  .sheet .stats { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; margin-bottom:6px; }
  .sheet .stats span { text-align:center; font-size:8.5px; color:#9aa6b4; border:1px solid rgba(255,255,255,.18); border-radius:4px; padding:4px 0; }
  .sheet .stats b { display:block; font-size:14px; color:#fff; }
  .sheet h3 { margin:8px 0 2px; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--hot); font-weight:600; }
  .sheet ul { margin:0; padding:0; list-style:none; columns:2; }
  .sheet p { margin:0; font-size:11px; color:#cfd8e3; }
  #randBtn { margin-top:10px; width:100%; padding:9px; background:transparent; border:1px solid var(--neon); color:var(--neon);
    border-radius:5px; text-transform:uppercase; letter-spacing:.1em; font-size:11px; }
  #closeGear { margin-top:6px; width:100%; padding:9px; background:transparent; border:1px solid var(--hot); color:var(--hot);
    border-radius:5px; text-transform:uppercase; letter-spacing:.1em; font-size:11px; }
  #dragHint { position:fixed; z-index:7; right:14px; bottom:14px; font-size:10.5px; color:#9aa6b4; background:var(--panel);
    padding:4px 8px; border-radius:4px; display:none; }
  #rot { position:fixed; z-index:7; left:50%; bottom:160px; transform:translateX(-50%); font-size:10.5px; color:#9aa6b4;
    background:var(--panel); padding:4px 8px; border-radius:4px; display:none; }
  @media (orientation:portrait) and (max-width:700px) { #rot { display:block; } }
  #err { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:24px;
    text-align:center; background:#050507; font-size:13px; line-height:1.5; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="vig"></div>
<div id="grain"></div>

<div class="hud" id="title">Floor 1 · <b id="region">Safe Room</b></div>
<div class="hud" id="stats">
  <span class="chip" id="explored">Explored 0%</span>
  <span class="chip" id="sight">Sight: Human eyes</span>
  <button id="gearBtn" type="button">Gear</button>
</div>
<div class="hud" id="sys"><span class="tag" id="sysTag">System</span><span id="sysMsg"></span></div>
<div id="rot">Turn your phone sideways for the full view</div>

<div id="stick" aria-label="Movement joystick"><div id="knob"></div></div>
<div id="bar" aria-label="Actions">
  <button class="act" id="aInteract" type="button">Interact</button>
  <button class="act" id="aCrouch" type="button">Crouch</button>
  <button class="act" id="aSight" type="button">Torch</button>
  <button class="act big" id="aJump" type="button">Jump</button>
</div>
<div id="menu"></div>

<div id="gear">
  <h2>Character</h2>
  <p>Everything here shows on the figure except jewelry.</p>
  <div id="tabs"></div>
  <div id="rows"></div>
  <button id="randBtn" type="button">Randomize</button>
  <button id="closeGear" type="button">Back to the crawl</button>
</div>
<div id="dragHint">Drag to turn your character</div>
<div id="err"></div>

<script src="three.min.js"></script>
<script>
(function () {
  'use strict';
  var errBox = document.getElementById('err');
  function fail(msg) { errBox.textContent = msg; errBox.style.display = 'flex'; }
  if (!window.THREE) { fail('The 3D library did not load. Check your connection and reload.'); return; }

  // ===================== Level One generator: the grand layout =====================
  // A fixed seed, so every player shares the same floor. 240 x 240 tiles laid out as a 3 x 3 grid of zones
  // joined by four grand boulevards. You start in the southwest corner (the Processing Center) and the stairs
  // are in the northeast corner (the Stairwell Gate), reached only through the Arena. Every boulevard ends in a
  // small safe room with free food. Each zone has its own architecture: studio halls, caves, offices, flooded
  // stacks, an open market cavern, an outdoor garden, a stadium and a gatehouse.
  // Map characters: # wall · . floor · , moss/grass floor · ~ water · D door · H hidden door · S stairs · @ start
  //   P pillar · B brazier · C loot box · K crate · R barrel · T table/desk/stall · W weapon rack · U training dummy
  //   b sack · h shelf · c candle stand · q cauldron · k book stand · g cage · v vase · X bathroom · F free food · Y tree
  function genLevel(seed) {
    var Wd = 240, Hd = 240, s = seed >>> 0;
    function rnd() { s = (s + 0x6D2B79F5) >>> 0; var t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
    function ri(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }
    function pick(a) { return a[Math.floor(rnd() * a.length)]; }
    var g = [], reg = [], rooms = [], spawns = [], zones = [], x, z, i;
    for (z = 0; z < Hd; z++) { g.push([]); reg.push([]); for (x = 0; x < Wd; x++) { g[z].push('#'); reg[z].push(-1); } }
    function inb(x, z) { return x > 0 && z > 0 && x < Wd - 1 && z < Hd - 1; }
    function isFloor(c) { return c === '.' || c === ',' || c === '~'; }
    function room(o, Z) { o.id = rooms.length; rooms.push(o); if (Z) { o.hood = Z.idx; Z.rooms.push(o); Z.rids[o.id] = 1; if (!o.theme) o.theme = Z.theme; if (!o.line) o.line = Z.line; } return o; }
    function put(x, z, c, rid) { if (!inb(x, z)) return; g[z][x] = c; if (rid !== undefined) reg[z][x] = rid; }
    function carve(x, z, rid, floor) { if (!inb(x, z)) return; if (g[z][x] === '#') g[z][x] = floor || '.'; if (rid !== undefined && reg[z][x] < 0) reg[z][x] = rid; }
    function carveRect(r, floor) { for (var zz = r.z0; zz <= r.z1; zz++) for (var xx = r.x0; xx <= r.x1; xx++) put(xx, zz, floor || '.', r.id); }
    function center(r) { return [Math.floor((r.x0 + r.x1) / 2), Math.floor((r.z0 + r.z1) / 2)]; }
    function free(x0, z0, x1, z1) { for (var zz = z0 - 1; zz <= z1 + 1; zz++) for (var xx = x0 - 1; xx <= x1 + 1; xx++) { if (!inb(xx, zz) || g[zz][xx] !== '#') return false; } return true; }
    // decor on open floor inside a room, kept off its edges and away from doors
    function scatter(r, chars, n) {
      for (var k = 0; k < n; k++) for (var t = 0; t < 20; t++) {
        var xx = ri(r.x0 + 1, r.x1 - 1), zz = ri(r.z0 + 1, r.z1 - 1);
        if (!inb(xx, zz) || reg[zz][xx] !== r.id || !isFloor(g[zz][xx]) || g[zz][xx] === '~' || nearDoor(xx, zz)) continue;
        g[zz][xx] = chars.charAt(Math.floor(rnd() * chars.length)); break;
      }
    }
    function nearDoor(xx, zz) { for (var dz = -1; dz <= 1; dz++) for (var dx = -1; dx <= 1; dx++) { var c = g[zz + dz] && g[zz + dz][xx + dx]; if (c === 'D' || c === 'H') return true; } return false; }
    function openSpot(r, tries) { // a free floor tile near the middle of a room
      var c = center(r);
      for (var rad = 0; rad < 8; rad++) for (var t = 0; t < (tries || 12); t++) {
        var xx = c[0] + ri(-rad, rad), zz = c[1] + ri(-rad, rad);
        if (inb(xx, zz) && reg[zz][xx] === r.id && (g[zz][xx] === '.' || g[zz][xx] === ',') && !taken[xx + ',' + zz]) { taken[xx + ',' + zz] = 1; return [xx, zz]; }
      }
      return null;
    }
    var taken = {};
    function spawnIn(r, fam, o) { var p = openSpot(r); if (!p) return; var sp = { kind: fam, x: p[0], z: p[1], room: r.id }; for (var k in o) sp[k] = o[k]; spawns.push(sp); }
    function tierRoll(z) { var q = rnd(); return q < (z.elite || 0.08) ? 3 : q < 0.38 ? 2 : 1; } // mostly grunts: a level 1 crawler should beat one alone
    // a straight or L-shaped passage of a given width
    function passage(ax, az, bx, bz, rid, floor, w) {
      var pts = rnd() < 0.5 ? [[ax, az], [bx, az], [bx, bz]] : [[ax, az], [ax, bz], [bx, bz]], h = Math.floor((w - 1) / 2);
      for (var k = 0; k < 2; k++) {
        var p = pts[k], q = pts[k + 1], dx = Math.sign(q[0] - p[0]), dz = Math.sign(q[1] - p[1]), xx = p[0], zz = p[1];
        while (true) {
          for (var a = -h; a < w - h; a++) for (var b = -h; b < w - h; b++) carve(xx + a, zz + b, rid, floor);
          if (xx === q[0] && zz === q[1]) break; xx += dx; zz += dz;
        }
      }
    }
    // a wandering cave tunnel
    function drunk(ax, az, bx, bz, rid, floor) {
      var xx = ax, zz = az, n = 0;
      while ((xx !== bx || zz !== bz) && n++ < 2000) {
        for (var a = 0; a < 2; a++) for (var b = 0; b < 2; b++) carve(xx + a, zz + b, rid, floor);
        if (rnd() < 0.72) { if (Math.abs(bx - xx) > Math.abs(bz - zz)) xx += Math.sign(bx - xx); else zz += Math.sign(bz - zz); }
        else if (rnd() < 0.5) xx += rnd() < 0.5 ? 1 : -1; else zz += rnd() < 0.5 ? 1 : -1;
        xx = Math.max(2, Math.min(Wd - 3, xx)); zz = Math.max(2, Math.min(Hd - 3, zz));
      }
    }
    function blob(cx, cz, rx, rz, fn) { for (var zz = cz - rz - 1; zz <= cz + rz + 1; zz++) for (var xx = cx - rx - 1; xx <= cx + rx + 1; xx++) { var d = ((xx - cx) * (xx - cx)) / (rx * rx + 0.01) + ((zz - cz) * (zz - cz)) / (rz * rz + 0.01); if (d <= 1 + (rnd() - 0.5) * 0.35) fn(xx, zz); } }

    // ---------- the grid: zone cells and boulevards ----------
    var CX = [[2, 73], [82, 157], [166, 237]], CZ = CX; // cell bounds; zones build inside them, one tile in
    var BV = [[75, 80], [159, 164]];                     // boulevard bands (x for the north-south ones, z for the east-west ones)
    function zone(o, col, row) {
      o.idx = zones.length; o.rooms = []; o.rids = {}; o.cell = [CX[col][0], CZ[row][0], CX[col][1], CZ[row][1]];
      o.x0 = o.cell[0] + 1; o.z0 = o.cell[1] + 1; o.x1 = o.cell[2] - 1; o.z1 = o.cell[3] - 1; zones.push(o); return o;
    }
    // ---------- boulevards ----------
    var BLINE = 'A grand boulevard. Pillars, banners and sponsor billboards. Mostly safe, if you keep moving.';
    function boulevard(name, horiz, band, a0, a1) {
      var r = room(horiz ? { name: name, theme: 'blvd', type: 'corridor', x0: a0, z0: band[0], x1: a1, z1: band[1], line: BLINE } : { name: name, theme: 'blvd', type: 'corridor', x0: band[0], z0: a0, x1: band[1], z1: a1, line: BLINE });
      carveRect(r);
      for (var t = a0 + 3, k = 0; t <= a1 - 3; t += 6, k++) {
        var cross = (t >= BV[0][0] - 2 && t <= BV[0][1] + 2) || (t >= BV[1][0] - 2 && t <= BV[1][1] + 2); if (cross) continue;
        if (horiz) { put(t, band[0], 'P'); put(t, band[1], 'P'); if (k % 4 === 2) put(t + 3, k % 8 === 2 ? band[0] : band[1], 'B'); }
        else { put(band[0], t, 'P'); put(band[1], t, 'P'); if (k % 4 === 2) put(k % 8 === 2 ? band[0] : band[1], t + 3, 'B'); }
      }
      return r;
    }
    var westway = boulevard('Westway', false, BV[0], 10, 229), eastway = boulevard('Eastway', false, BV[1], 10, 229);
    var upper = boulevard('Upper Concourse', true, BV[0], 10, 164), lower = boulevard('Lower Concourse', true, BV[1], 10, 229);
    var gateCon = boulevard('Gate Concourse', true, BV[0], 166, 229); // walled off from the rest: the Arena is the only way in
    gateCon.line = 'The concourse past the Arena. The crowd noise follows you. So do the cameras.';
    // ---------- a small safe room with free food at the end of every boulevard ----------
    var SNACK = ['The Snack Closet', 'The Snack Bar', 'The Vending Nook', 'Hydration Station', 'The Comp Buffet', 'Catering Overflow', 'Green Room B', 'The Unofficial Break Room'], sn = 0;
    function endRoom(x0, z0, x1, z1, doors, food) {
      var r = room({ name: SNACK[sn++], theme: 'crypt', type: 'safe', x0: x0, z0: z0, x1: x1, z1: z1, line: 'A tiny safe room. The catering table is free and it heals you. The System says "within reason."' });
      carveRect(r); doors.forEach(function (d) { put(d[0], d[1], 'D', r.id); }); food.forEach(function (f) { put(f[0], f[1], 'F'); });
      put(x0 + 1, z0 + 1, 'c'); put(x1 - 1, z1 - 1, 'c'); return r;
    }
    BV.forEach(function (b, k) {
      endRoom(b[0] - 1, 2, b[1] + 1, 8, [[b[0] + 2, 9], [b[0] + 3, 9]], [[b[0] + 2, 3], [b[0] + 3, 3]]);            // north end of a north-south boulevard
      endRoom(b[0] - 1, 231, b[1] + 1, 237, [[b[0] + 2, 230], [b[0] + 3, 230]], [[b[0] + 2, 236], [b[0] + 3, 236]]); // south end
      endRoom(2, b[0] - 1, 8, b[1] + 1, [[9, b[0] + 2], [9, b[0] + 3]], [[3, b[0] + 2], [3, b[0] + 3]]);             // west end of an east-west boulevard
      endRoom(231, b[0] - 1, 237, b[1] + 1, [[230, b[0] + 2], [230, b[0] + 3]], [[236, b[0] + 2], [236, b[0] + 3]]); // east end
    });

    // ---------- gates: a wide mouth from a boulevard into a zone, tunnelled to the zone's nearest floor ----------
    function gate(Z, side, at, name) {
      var mouth = room({ name: name || Z.name + ' gate', type: 'corridor', x0: 0, z0: 0, x1: 0, z1: 0 }, Z), ox, oz, ix, iz;
      if (side === 'E') { ox = Z.cell[2] + 1; oz = at; ix = Z.x1; iz = at; } else if (side === 'W') { ox = Z.cell[0] - 1; oz = at; ix = Z.x0; iz = at; }
      else if (side === 'N') { ox = at; oz = Z.cell[1] - 1; ix = at; iz = Z.z0; } else { ox = at; oz = Z.cell[3] + 1; ix = at; iz = Z.z1; }
      var best = null, bd = 1e9;
      for (var zz = Z.z0; zz <= Z.z1; zz++) for (var xx = Z.x0; xx <= Z.x1; xx++) {
        if (!isFloor(g[zz][xx]) || !Z.rids[reg[zz][xx]] || reg[zz][xx] === mouth.id) continue;
        var dd = Math.abs(xx - ix) + Math.abs(zz - iz); if (dd < bd) { bd = dd; best = [xx, zz]; }
      }
      if (!best) return;
      passage(ox, oz, best[0], best[1], mouth.id, '.', 3);
      mouth.x0 = Math.min(ox, best[0]); mouth.x1 = Math.max(ox, best[0]); mouth.z0 = Math.min(oz, best[1]); mouth.z1 = Math.max(oz, best[1]);
    }

    // ---------- rooms in blocks around two crossing halls (studio and office zones) ----------
    function blockRooms(Z, o) {
      var hw = o.hall, hx0 = Math.floor((Z.x0 + Z.x1) / 2) - (hw >> 1), hz0 = Math.floor((Z.z0 + Z.z1) / 2) - (hw >> 1);
      var halls = room({ name: o.hallName, type: 'corridor', x0: Z.x0, z0: Z.z0, x1: Z.x1, z1: Z.z1 }, Z);
      for (var zz = Z.z0; zz <= Z.z1; zz++) for (var k = 0; k < hw; k++) put(hx0 + k, zz, '.', halls.id);
      for (var xx = Z.x0; xx <= Z.x1; xx++) for (k = 0; k < hw; k++) put(xx, hz0 + k, '.', halls.id);
